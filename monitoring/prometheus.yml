global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:19090']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:19100']
  # Reserved for a separately started, authorized isolated API; never point at production.
  - job_name: isolated_api
    static_configs:
      - targets: ['127.0.0.1:18200']
