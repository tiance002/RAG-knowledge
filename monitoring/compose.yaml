name: rag-monitoring-isolated
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --web.listen-address=127.0.0.1:19090
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle=false
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    network_mode: host
    mem_limit: 256m
    cpus: 0.35
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:19090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 3
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '13000'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_INSTALL_PLUGINS: ''
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    network_mode: host
    mem_limit: 256m
    cpus: 0.35
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:13000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --web.listen-address=127.0.0.1:19100
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/docker/netns|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    network_mode: host
    mem_limit: 96m
    cpus: 0.15
    restart: unless-stopped
volumes:
  prometheus_data:
  grafana_data:
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
