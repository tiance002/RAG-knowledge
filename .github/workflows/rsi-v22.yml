name: RSI v2.3 portable checks

on:
  pull_request:
  push:
    branches: ['codex/rsi-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install pytest==8.3.5
      - name: Check frozen source bytes
        run: python -c "from rsik.foundation import verify_boundary; verify_boundary()"
      - name: Run portable contract and synthetic evidence tests
        run: >-
          python -B -m pytest rsik/tests tests/test_query_workflow.py
          backend/tests/test_rsi_candidates.py backend/tests/test_rsi_feedback.py
          backend/tests/test_rsi_decision.py backend/tests/test_rsi_business_source.py
          -vv --tb=short --basetemp=.rsi-ci-tmp
